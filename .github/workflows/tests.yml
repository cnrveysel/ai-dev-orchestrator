name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      # This test needs a native window on an interactive desktop.
      - run: python -m pytest -q -k "not test_real_window_capture_of_a_started_resource_is_an_honest_image_artifact"
